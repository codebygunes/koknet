[package]
name = "cli"
version = "0.1.0"
edition = "2021"
description = "Command-line interface for Koknet P2P Zero-Metadata Core"
license = "MIT OR Apache-2.0"

[dependencies]
koknet_core = { path = "../core" }
storage = { path = "../storage" }
transport = { path = "../transport" }
# Cleaned up all invalid features, leaving only 'tokio' and 'macros' required by the CLI
libp2p = { version = "0.53", features = ["tokio", "macros"] }
tokio = { version = "1.32", features = ["full"] }
clap = { version = "4.4", features = ["derive"] }
futures = "0.3"
env_logger = "0.10"
log = "0.4"