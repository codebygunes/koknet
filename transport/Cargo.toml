[package]
name = "transport"
version = "0.1.0"
edition = "2021"
description = "WebRTC P2P Networking, DPI-Evasion, and WASM bindings for Koknet"
license = "MIT OR Apache-2.0"

[dependencies]
koknet_core = { path = "../core" }
# "webrtc" silindi, yerine kodumuzun kullandığı "tcp" eklendi
libp2p = { version = "0.53", features = ["tcp", "gossipsub", "identify", "noise", "yamux", "macros"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
rand = "0.8"
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.32", features = ["full"] }
libp2p = { version = "0.53", features = ["tokio"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
# "wasm-ext" yerine güncel olan "wasm-bindgen" yazıldı
libp2p = { version = "0.53", features = ["wasm-bindgen"] }
getrandom = { version = "0.2", features = ["js"] }