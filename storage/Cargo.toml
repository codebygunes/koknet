[package]
name = "storage"
version = "0.1.0"
edition = "2021"
description = "Local-first SQLite storage and CRDT conflict-free resolution engine for Koknet"

[dependencies]
koknet_core = { path = "../core" }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"